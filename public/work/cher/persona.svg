<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <pattern id="d-cher-p" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#111111"/>
  <rect width="1200" height="675" fill="url(#d-cher-p)"/>

  <g font-family="ui-monospace, monospace" fill="#e5e5e5">
    <text x="80" y="70" font-size="13" letter-spacing="3" fill="#5a5a5a">// PERSONA · CHER USER</text>

    <rect x="80" y="100" width="1040" height="2" fill="#1f1f1f"/>

    <g>
      <text x="80" y="160" font-size="13" fill="#5a5a5a">NAME</text>
      <text x="80" y="195" font-size="32" font-weight="500" fill="#A3FF12">Sara, 28</text>
      <text x="80" y="225" font-size="14" fill="#8a8a8a">Mid-career, London, works late, goes out</text>
    </g>

    <g>
      <text x="80" y="290" font-size="13" fill="#5a5a5a">WANTS</text>
      <text x="80" y="320" font-size="15">$ cut taxi spend</text>
      <text x="80" y="345" font-size="15">$ reduce her carbon footprint</text>
      <text x="80" y="370" font-size="15">$ get home from East London at 1am without dread</text>
    </g>

    <g>
      <text x="80" y="440" font-size="13" fill="#5a5a5a">BLOCKERS</text>
      <text x="80" y="470" font-size="15">$ existing ride-share matches with strangers, any gender</text>
      <text x="80" y="495" font-size="15">$ 1 in 3 women refuse a car with a man after dark</text>
      <text x="80" y="520" font-size="15">$ London men, in her words, &quot;very confident&quot;</text>
    </g>

    <g>
      <text x="700" y="160" font-size="13" fill="#5a5a5a">3 NEEDS</text>
      <text x="700" y="195" font-size="20" fill="#A3FF12">01.</text>
      <text x="745" y="195" font-size="15">match with other women</text>
      <text x="700" y="225" font-size="20" fill="#A3FF12">02.</text>
      <text x="745" y="225" font-size="15">see what she has in common with them</text>
      <text x="700" y="255" font-size="20" fill="#A3FF12">03.</text>
      <text x="745" y="255" font-size="15">choose who to share with by rating</text>
    </g>

    <g>
      <text x="700" y="320" font-size="13" fill="#5a5a5a">QUOTE</text>
      <text x="700" y="365" font-size="18" font-style="italic" fill="#e5e5e5">&quot;I would take an Uber over</text>
      <text x="700" y="390" font-size="18" font-style="italic" fill="#e5e5e5">a shared car with a guy I</text>
      <text x="700" y="415" font-size="18" font-style="italic" fill="#e5e5e5">don&apos;t know, every time.&quot;</text>
      <text x="700" y="445" font-size="12" fill="#5a5a5a">$ user 7 of 12 · hotel bar test</text>
    </g>

    <text x="80" y="630" font-size="12" fill="#5a5a5a">$ built in hour 6 of 24 · refined through testing rounds 1 and 2</text>
  </g>
</svg>
