<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <pattern id="d-moxy-loop" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <marker id="arr-moxy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A3FF12"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="#111111"/>
  <rect width="1600" height="700" fill="url(#d-moxy-loop)"/>

  <g font-family="ui-monospace, monospace" fill="#e5e5e5">
    <text x="80" y="80" font-size="13" letter-spacing="3" fill="#5a5a5a">// THE STUDY · PRACTICE · FEEDBACK LOOP</text>

    <g>
      <rect x="120" y="250" width="260" height="120" fill="#161616" stroke="#1f1f1f" stroke-width="1"/>
      <text x="250" y="295" text-anchor="middle" font-size="17" fill="#A3FF12">// study</text>
      <text x="250" y="325" text-anchor="middle" font-size="14">curated questions</text>
      <text x="250" y="345" text-anchor="middle" font-size="14" fill="#8a8a8a">model answers · tips</text>
    </g>

    <g>
      <rect x="670" y="250" width="260" height="120" fill="#161616" stroke="#1f1f1f" stroke-width="1"/>
      <text x="800" y="295" text-anchor="middle" font-size="17" fill="#A3FF12">// practice</text>
      <text x="800" y="325" text-anchor="middle" font-size="14">record yourself</text>
      <text x="800" y="345" text-anchor="middle" font-size="14" fill="#8a8a8a">curated playlists by role</text>
    </g>

    <g>
      <rect x="1220" y="250" width="260" height="120" fill="#161616" stroke="#1f1f1f" stroke-width="1"/>
      <text x="1350" y="295" text-anchor="middle" font-size="17" fill="#A3FF12">// feedback</text>
      <text x="1350" y="325" text-anchor="middle" font-size="14">self-review or peer</text>
      <text x="1350" y="345" text-anchor="middle" font-size="14" fill="#8a8a8a">comments on video</text>
    </g>

    <line x1="380" y1="310" x2="665" y2="310" stroke="#A3FF12" stroke-width="2" marker-end="url(#arr-moxy)"/>
    <line x1="930" y1="310" x2="1215" y2="310" stroke="#A3FF12" stroke-width="2" marker-end="url(#arr-moxy)"/>

    <path d="M 1350 370 C 1350 520, 250 520, 250 380" stroke="#A3FF12" stroke-width="2" fill="none" stroke-dasharray="6,6" marker-end="url(#arr-moxy)"/>
    <text x="800" y="555" text-anchor="middle" font-size="14" fill="#5a5a5a">// next rep · with what you just learned</text>

    <text x="80" y="640" font-size="12" fill="#5a5a5a">$ each pass through the loop = one rep · reps compound</text>
  </g>
</svg>
