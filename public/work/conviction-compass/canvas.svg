<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#111111"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- three columns -->
  <g font-family="ui-monospace, monospace" fill="#e5e5e5">
    <!-- col headers -->
    <text x="120" y="80" font-size="14" letter-spacing="2" fill="#A3FF12">// BELIEF</text>
    <text x="500" y="80" font-size="14" letter-spacing="2" fill="#A3FF12">// REASON</text>
    <text x="880" y="80" font-size="14" letter-spacing="2" fill="#A3FF12">// WOULD CHANGE OUR MIND</text>

    <!-- column rules -->
    <line x1="80" y1="105" x2="380" y2="105" stroke="#1f1f1f" stroke-width="1"/>
    <line x1="460" y1="105" x2="780" y2="105" stroke="#1f1f1f" stroke-width="1"/>
    <line x1="840" y1="105" x2="1140" y2="105" stroke="#1f1f1f" stroke-width="1"/>

    <!-- rows -->
    <g font-size="16">
      <text x="120" y="150">Founders self-administer</text>
      <text x="500" y="150">They already journal</text>
      <text x="880" y="150">&lt; 20% completion</text>

      <text x="120" y="220">Sharing > publishing</text>
      <text x="500" y="220">Trust circles, not feeds</text>
      <text x="880" y="220">Shares to &gt; 5 ppl</text>

      <text x="120" y="290">Date stamps matter</text>
      <text x="500" y="290">Beliefs need falsifiability</text>
      <text x="880" y="290">Operators never revisit</text>

      <text x="120" y="360">Paper before software</text>
      <text x="500" y="360">UI obscures the framing</text>
      <text x="880" y="360">Paper users skip Qs</text>
    </g>

    <!-- row dividers -->
    <g stroke="#1f1f1f" stroke-width="0.5" stroke-dasharray="2,4">
      <line x1="80" y1="180" x2="1140" y2="180"/>
      <line x1="80" y1="250" x2="1140" y2="250"/>
      <line x1="80" y1="320" x2="1140" y2="320"/>
    </g>

    <!-- vertical column dividers -->
    <line x1="430" y1="50" x2="430" y2="450" stroke="#1f1f1f" stroke-width="1"/>
    <line x1="810" y1="50" x2="810" y2="450" stroke="#1f1f1f" stroke-width="1"/>

    <!-- footer caption -->
    <text x="80" y="620" font-size="13" fill="#5a5a5a">fig. canvas v0.3 — printed/filled in 12 operator sessions</text>
    <text x="80" y="640" font-size="13" fill="#5a5a5a">columns: belief · reason · would-change-our-mind</text>
  </g>
</svg>
