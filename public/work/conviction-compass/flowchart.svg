<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <pattern id="dots2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A3FF12"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="#111111"/>
  <rect width="1600" height="700" fill="url(#dots2)"/>

  <g font-family="ui-monospace, monospace" fill="#e5e5e5">
    <!-- nodes -->
    <g>
      <rect x="80" y="240" width="220" height="100" fill="#161616" stroke="#1f1f1f" stroke-width="1"/>
      <text x="190" y="280" text-anchor="middle" font-size="15" fill="#A3FF12">// belief</text>
      <text x="190" y="305" text-anchor="middle" font-size="14">written + dated</text>
    </g>

    <g>
      <rect x="430" y="240" width="220" height="100" fill="#161616" stroke="#1f1f1f" stroke-width="1"/>
      <text x="540" y="280" text-anchor="middle" font-size="15" fill="#A3FF12">// test</text>
      <text x="540" y="305" text-anchor="middle" font-size="14">designed to falsify</text>
    </g>

    <g>
      <rect x="780" y="240" width="220" height="100" fill="#161616" stroke="#1f1f1f" stroke-width="1"/>
      <text x="890" y="280" text-anchor="middle" font-size="15" fill="#A3FF12">// evidence</text>
      <text x="890" y="305" text-anchor="middle" font-size="14">timestamped</text>
    </g>

    <g>
      <rect x="1130" y="240" width="220" height="100" fill="#161616" stroke="#1f1f1f" stroke-width="1"/>
      <text x="1240" y="280" text-anchor="middle" font-size="15" fill="#A3FF12">// update</text>
      <text x="1240" y="305" text-anchor="middle" font-size="14">canvas mutates</text>
    </g>

    <!-- arrows -->
    <g stroke="#A3FF12" stroke-width="2" fill="none">
      <line x1="300" y1="290" x2="425" y2="290" marker-end="url(#arrow)"/>
      <line x1="650" y1="290" x2="775" y2="290" marker-end="url(#arrow)"/>
      <line x1="1000" y1="290" x2="1125" y2="290" marker-end="url(#arrow)"/>
    </g>

    <!-- feedback loop -->
    <path d="M 1240 340 C 1240 480, 190 480, 190 340" stroke="#A3FF12" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <text x="715" y="510" text-anchor="middle" font-size="14" fill="#5a5a5a">// weekly loop · update belief or kill it</text>

    <!-- labels -->
    <text x="80" y="160" font-size="14" letter-spacing="2" fill="#5a5a5a">FIG. 2 — FALSIFICATION LOOP</text>
    <text x="80" y="190" font-size="13" fill="#5a5a5a">a belief becomes a test, a test becomes evidence, evidence updates the belief.</text>
  </g>
</svg>
